{% extends "base.html" %}

{% block title %}Neue Subscription - Substracker{% endblock %}

{% block content %}
<h2>Neue Subscription hinzufügen</h2>

<form method="POST" class="form">
    <div class="form-group">
        <label for="name">Name *</label>
        <input type="text" id="name" name="name" required placeholder="z.B. Netflix">
    </div>

    <div class="form-group">
        <label for="amount">Betrag (€) *</label>
        <input type="number" id="amount" name="amount" step="0.01" required placeholder="z.B. 12.99">
    </div>

    <div class="form-group">
        <label for="cycle">Zyklus *</label>
        <select id="cycle" name="cycle" required>
            <option value="monthly">Monatlich</option>
            <option value="yearly">Jährlich</option>
            <option value="quarterly">Quartalsweise</option>
        </select>
    </div>

    <div class="form-group">
        <label for="due_date">Fälligkeitsdatum *</label>
        <input type="date" id="due_date" name="due_date" required>
    </div>

    <div class="form-group">
        <label for="login">Login/E-Mail</label>
        <input type="text" id="login" name="login" placeholder="z.B. deine@email.com">
    </div>

    <div class="form-group">
        <label for="password">Passwort</label>
        <input type="password" id="password" name="password" placeholder="Passwort (verschlüsselt speichern wäre besser!)">
    </div>

    <div class="form-group">
        <label for="notes">Notizen</label>
        <textarea id="notes" name="notes" rows="4" placeholder="Zusätzliche Informationen..."></textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn-primary">Speichern</button>
        <a href="{{ url_for('index') }}" class="btn-secondary">Abbrechen</a>
    </div>
</form>
{% endblock %}
