{% extends "base.html" %}

{% block title %}Subscription bearbeiten - Substracker{% endblock %}

{% block content %}
<h2>Subscription bearbeiten: {{ subscription.name }}</h2>

<form method="POST" class="form">
    <div class="form-group">
        <label for="name">Name *</label>
        <input type="text" id="name" name="name" required value="{{ subscription.name }}">
    </div>

    <div class="form-group">
        <label for="amount">Betrag (€) *</label>
        <input type="number" id="amount" name="amount" step="0.01" required value="{{ subscription.amount }}">
    </div>

    <div class="form-group">
        <label for="cycle">Zyklus *</label>
        <select id="cycle" name="cycle" required>
            <option value="monthly" {% if subscription.cycle == 'monthly' %}selected{% endif %}>Monatlich</option>
            <option value="yearly" {% if subscription.cycle == 'yearly' %}selected{% endif %}>Jährlich</option>
            <option value="quarterly" {% if subscription.cycle == 'quarterly' %}selected{% endif %}>Quartalsweise</option>
        </select>
    </div>

    <div class="form-group">
        <label for="due_date">Fälligkeitsdatum *</label>
        <input type="date" id="due_date" name="due_date" required value="{{ subscription.due_date.strftime('%Y-%m-%d') }}">
    </div>

    <div class="form-group">
        <label for="login">Login/E-Mail</label>
        <input type="text" id="login" name="login" value="{{ subscription.login or '' }}">
    </div>

    <div class="form-group">
        <label for="password">Passwort</label>
        <input type="password" id="password" name="password" value="{{ subscription.password or '' }}">
    </div>

    <div class="form-group">
        <label for="notes">Notizen</label>
        <textarea id="notes" name="notes" rows="4">{{ subscription.notes or '' }}</textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn-primary">Speichern</button>
        <a href="{{ url_for('index') }}" class="btn-secondary">Abbrechen</a>
    </div>
</form>
{% endblock %}
